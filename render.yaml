# Defines the secret keys and credentials that will be configured in the Render dashboard.
envVarGroups:
  - name: tunetailor-secrets
    envVars:
      - key: OPENAI_API_KEY
      - key: SUNO_API_KEY
      - key: FLASK_SECRET_KEY
      - key: ADMIN_USERNAME
      - key: ADMIN_PASSWORD
      - key: PAYPAL_CLIENT_ID
      - key: PAYPAL_CLIENT_SECRET
      - key: SONG_PRICE
      - key: PAYPAL_MODE

# Defines the managed PostgreSQL database service.
databases:
  - name: tunetailor-db
    databaseName: tunetailor_db # The name of the database inside postgres
    plan: free

# Defines the web service that runs the Flask application.
services:
  - type: web
    name: tunetailor
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.19
      - key: DATABASE_URL
        fromDatabase:
          name: tunetailor-db
          property: internalUrl
      - key: PUBLIC_URL
        fromService:
          name: tunetailor
          type: web
          property: url
      - fromGroup: tunetailor-secrets