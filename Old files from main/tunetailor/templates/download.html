<!DOCTYPE html>
<html>
<head>
    <title>Download Your Song</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Your Song is Ready!</h1>
        {% for link in links %}
            <p><a href="{{ link }}" class="btn btn-primary" download>Download Song {{ loop.index }}</a></p>
        {% endfor %}
        <a href="/" class="btn btn-secondary">Create Another Song</a>
    </div>
</body>
</html>
