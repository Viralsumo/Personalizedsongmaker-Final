<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneTailor - Create Your Song</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand {
            font-weight: 600;
            font-size: 1.5rem;
        }
        .container {
            flex: 1;
            max-width: 600px;
            margin-top: 2rem;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background-color: #6b48ff;
            border: none;
            padding: 10px 20px;
            font-size: 1.1rem;
            border-radius: 10px;
        }
        .btn-primary:hover {
            background-color: #5439cc;
        }
        .form-control, .form-select {
            border-radius: 10px;
        }
        footer {
            background-color: #f8f9fa;
            padding: 1rem 0;
            text-align: center;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">TuneTailor</a>
        </div>
    </nav>
    <div class="container">
        <div class="card p-4">
            <h1 class="text-center mb-4">Create Your Custom Song</h1>
            <form method="POST" action="/generate_lyrics">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter recipient's name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Occasion</label>
                    <select name="occasion" class="form-select" required>
                        <option value="" disabled selected>Select an occasion</option>
                        <option>Birthday</option>
                        <option>Anniversary</option>
                        <option>Wedding</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Details</label>
                    <textarea name="details" class="form-control" placeholder="Share some details (e.g., hobbies, special traits)" rows="4" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Style</label>
                    <select name="style" class="form-select" required>
                        <option value="" disabled selected>Select a style</option>
                        <option>pop</option>
                        <option>rock</option>
                        <option>jazz</option>
                        <option>surprise</option>
                    </select>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Generate Lyrics</button>
                </div>
            </form>
        </div>
    </div>
    <footer>
        <p>&copy; 2025 TuneTailor. <a href="/terms">Terms</a> | <a href="/privacy">Privacy</a></p>
    </footer>
</body>
</html>
