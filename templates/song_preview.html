<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneTailor - Your Song Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand {
            font-weight: 600;
            font-size: 1.5rem;
        }
        .container {
            flex: 1;
            max-width: 600px;
            margin-top: 2rem;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .preview-player {
            width: 100%;
            margin-bottom: 1rem;
        }
        #paypal-button-container {
            margin-top: 1.5rem;
            margin-left: auto;
            margin-right: auto;
            min-height: 50px; /* Reserve space for the button */
        }
        .player-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            background-color: #f8f9fa;
            padding: 0.75rem 1rem;
            border-radius: 50px;
            margin-bottom: 1rem;
        }
        .play-btn {
            background: #6b48ff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
        }
        .progress-bar-container {
            flex-grow: 1;
            height: 8px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            width: 0;
            height: 100%;
            background-color: #6b48ff;
            transition: width 0.1s linear;
        }
        #paypal-button-container {
            margin-top: 1.5rem;
            margin-left: auto;
            margin-right: auto;
            min-height: 50px; /* Reserve space for the button */
        }
        footer {
            background-color: #f8f9fa;
            padding: 1rem 0;
            text-align: center;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">TuneTailor</a>
        </div>
    </nav>
    <div class="container">
        <div class="card p-4">
            <h1 class="mb-3">Listen to a Preview!</h1>
            {% for preview_path in task.preview_paths %}
                <div class="preview-instance mt-3">
                    <h5 class="mb-2">Preview {{ loop.index }} (30s)</h5>
                    <div class="player-container">
                        <button class="play-btn">▶️</button>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill"></div>
                        </div>
                    </div>
                    <!-- The audio element is hidden but controlled by our script -->
                    <audio class="preview-player" src="{{ preview_path }}" preload="metadata"></audio>
                </div>
            {% endfor %}
            <p class="mt-4">Love it? Pay to unlock and download both full, high-quality songs!</p>
            <div id="paypal-button-container"></div>
        </div>
    </div>
    <footer>
        <p>&copy; 2025 TuneTailor. <a href="/terms">Terms</a> | <a href="/privacy">Privacy</a></p>
    </footer>

    <script src="https://www.paypal.com/sdk/js?client-id={{ paypal_client_id }}&currency=USD"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const previewPlayers = document.querySelectorAll('.preview-instance');

            previewPlayers.forEach(playerInstance => {
                const audio = playerInstance.querySelector('.preview-player');
                const playBtn = playerInstance.querySelector('.play-btn');
                const progressBar = playerInstance.querySelector('.progress-bar-fill');
                const PREVIEW_DURATION = 30; // 30 seconds

                // 1. When the user clicks the play button
                playBtn.addEventListener('click', () => {
                    if (audio.paused) {
                        // Pause all other players before playing this one
                        document.querySelectorAll('.preview-player').forEach(p => {
                            if (p !== audio) p.pause();
                        });
                        audio.play();
                    } else {
                        audio.pause();
                    }
                });

                // 2. Listen for time updates to enforce the 30-second limit
                audio.addEventListener('timeupdate', () => {
                    // 3. If the current time exceeds the preview duration, pause the audio
                    if (audio.currentTime >= PREVIEW_DURATION) {
                        audio.pause();
                        audio.currentTime = 0; // Reset for next play
                    }
                    // Update the progress bar
                    const progress = (audio.currentTime / PREVIEW_DURATION) * 100;
                    progressBar.style.width = `${progress}%`;
                });

                audio.addEventListener('play', () => { playBtn.textContent = '⏸️'; });
                audio.addEventListener('pause', () => { playBtn.textContent = '▶️'; });
            });
        });

        paypal.Buttons({
            createOrder: async () => {
                const response = await fetch(`/create_paypal_order/{{ task.task_id }}`, { method: 'POST' });
                const orderData = await response.json();
                if (orderData.orderID) {
                    return orderData.orderID;
                } else {
                    console.error('Could not create PayPal order:', orderData.error);
                    alert('There was an issue setting up the payment. Please try again.');
                    throw new Error(orderData.error);
                }
            },
            onApprove: async (data, actions) => {
                try {
                    const response = await fetch(`/capture_paypal_order/${data.orderID}`, { method: 'POST' });
                    const captureData = await response.json();
                    if (captureData.status === 'success' && captureData.redirect_url) {
                        alert('Payment successful! Redirecting to your download...');
                        //window.location.href = captureData.redirect_url;
                        window.top.location.href = captureData.redirect_url;
                    } else {
                        // Handle cases where the server responds with an error
                        console.error('Payment capture failed:', captureData.error || 'Unknown server error');
                        alert('Your payment was approved, but we could not finalize your order. Please contact support.');
                    }
                } catch (error) {
                    // Handle network errors or if the server is down
                    console.error('Error capturing payment:', error);
                    alert('A network error occurred while finalizing your payment. Please check your connection or contact support.');
                }
            },
            onError: (err) => {
                console.error('PayPal button error:', err);
                alert('An error occurred with the PayPal button. Please refresh the page and try again.');
            }
        }).render('#paypal-button-container').catch(err => {
            console.error('Failed to render PayPal buttons:', err);
            document.getElementById('paypal-button-container').innerText = 'Could not load payment options. Please refresh.';
        });
    </script>
</body>
</html>
