<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneTailor - Review Your Lyrics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand {
            font-weight: 600;
            font-size: 1.5rem;
        }
        .container {
            flex: 1;
            max-width: 700px;
            margin-top: 2rem;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .lyrics-box {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 1.5rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 40vh;
            overflow-y: auto;
        }
        footer {
            background-color: #f8f9fa;
            padding: 1rem 0;
            text-align: center;
            margin-top: auto;
        }
        /* Loading Overlay */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1050;
            text-align: center;
        }
        .music-notes {
            position: relative;
            width: 100px;
            height: 100px;
        }
        .music-notes span {
            position: absolute;
            font-size: 2rem;
            animation: float 2s ease-in-out infinite;
        }
        .music-notes .note-1 { top: 20%; left: 10%; animation-delay: 0s; }
        .music-notes .note-2 { top: 60%; left: 30%; animation-delay: 0.5s; }
        .music-notes .note-3 { top: 30%; left: 70%; animation-delay: 1s; }
        .music-notes .note-4 { top: 70%; left: 80%; animation-delay: 1.5s; }
        @keyframes float {
            0% { transform: translateY(0px); opacity: 1; }
            50% { transform: translateY(-20px); opacity: 0.5; }
            100% { transform: translateY(0px); opacity: 1; }
        }
        #loading-message {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
        }
        #loading-subtext {
            margin-top: 10px;
            color: #6c757d;
        }
        /* Quote styling */
        #quote-container {
            margin-top: 2rem;
            padding: 0 1rem;
            max-width: 600px;
        }
        #music-quote {
            font-size: 1.1rem;
            font-style: italic;
            color: #495057;
        }
        .progress {
            width: 50%;
            margin-top: 1.5rem;
            height: 1.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">TuneTailor</a>
        </div>
    </nav>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="music-notes">
            <span class="note-1">🎵</span>
            <span class="note-2">🎶</span>
            <span class="note-3">🎼</span>
            <span class="note-4">🎵</span>
        </div>
        <div id="quote-container">
            <p id="music-quote"></p>
            <p id="quote-author" class="fw-bold"></p>
        </div>
        <div class="progress">
            <div id="loading-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                0%
            </div>
        </div>
        <p id="loading-message">Composing your masterpiece...</p>
        <p id="loading-subtext">This can take 1-3 minutes. Please wait!</p>
    </div>

    <div class="container">
        <div class="card p-4">
            <h1 class="mb-3 text-center">Your Custom Lyrics</h1>
            <p class="text-center text-muted">Review the lyrics below. If you love them, let's turn them into a song!</p>
            <div class="lyrics-box my-3">
                {{ lyrics }}
            </div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-3">
                <a href="/" class="btn btn-secondary me-md-2">Start Over</a>
                <button id="generate-song-btn" class="btn btn-primary">Generate Song!</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 TuneTailor. <a href="/terms">Terms</a> | <a href="/privacy">Privacy</a></p>
    </footer>

    <script>
        const quotes = [
            { text: "Where words fail, music speaks.", author: "Hans Christian Andersen" },
            { text: "Music is the universal language of mankind.", author: "Henry Wadsworth Longfellow" },
            { text: "Without music, life would be a mistake.", author: "Friedrich Nietzsche" },
            { text: "Music expresses that which cannot be said and on which it is impossible to be silent.", author: "Victor Hugo" },
            { text: "Music is the shorthand of emotion.", author: "Leo Tolstoy" },
            { text: "One good thing about music, when it hits you, you feel no pain.", author: "Bob Marley" }
        ];

        let quoteInterval;
        let progressInterval;

        function changeQuote() {
            const quoteElement = document.getElementById('music-quote');
            const authorElement = document.getElementById('quote-author');
            const randomIndex = Math.floor(Math.random() * quotes.length);
            quoteElement.textContent = `"${quotes[randomIndex].text}"`;
            authorElement.textContent = `- ${quotes[randomIndex].author}`;
        }

        document.getElementById('generate-song-btn').addEventListener('click', async () => {
            document.getElementById('loading-overlay').style.display = 'flex';

            // Start the quote rotation
            changeQuote(); // Show the first quote immediately
            quoteInterval = setInterval(changeQuote, 5000); // Change quote every 5 seconds

            // Start the progress bar animation
            const progressBar = document.getElementById('loading-progress-bar');
            let progress = 0;
            const totalDuration = 120; // Simulate over 2 minutes (120 seconds)
            const maxProgress = 95; // Stop at 95% to wait for completion

            progressInterval = setInterval(() => {
                if (progress < maxProgress) {
                    progress += 100 / totalDuration;
                    const displayProgress = Math.min(Math.floor(progress), maxProgress);
                    progressBar.style.width = displayProgress + '%';
                    progressBar.setAttribute('aria-valuenow', displayProgress);
                    progressBar.innerText = displayProgress + '%';
                } else {
                    clearInterval(progressInterval);
                }
            }, 1000);

            try {
                const response = await fetch('/generate_song', { method: 'POST' });
                if (!response.ok) {
                    throw new Error(`Server error: ${response.statusText}`);
                }
                const data = await response.json();
                pollTaskStatus(data.task_id);
            } catch (error) {
                console.error('Failed to start song generation:', error);
                clearInterval(progressInterval); // Stop progress on error
                clearInterval(quoteInterval); // Stop quote rotation on error
                alert('Could not start song generation. Please try again.');
                document.getElementById('loading-overlay').style.display = 'none';
            }
        });

        function pollTaskStatus(taskId) {
            const interval = setInterval(async () => {
                const progressBar = document.getElementById('loading-progress-bar');
                const response = await fetch(`/check_task/${taskId}`);
                const data = await response.json();

                if (data.status === 'completed_preview_available') {
                    clearInterval(interval);
                    clearInterval(progressInterval);
                    clearInterval(quoteInterval); // Stop quote rotation
                    // Animate to 100% before redirecting
                    progressBar.style.width = '100%';
                    progressBar.innerText = '100%';
                    setTimeout(() => {
                        window.location.href = `/song_preview/${taskId}`;
                    }, 500); // Short delay to show 100%
                } else if (data.status === 'error') {
                    clearInterval(interval);
                    clearInterval(progressInterval);
                    document.getElementById('loading-overlay').style.display = 'none';
                    clearInterval(quoteInterval); // Stop quote rotation
                    alert(`An error occurred: ${data.error}`);
                }
                // If status is 'pending', do nothing and let the polling continue.
            }, 5000); // Poll every 5 seconds
        }
    </script>
</body>
</html>
