<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneTailor - Download Song</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #e0eafc, #cfdef3); min-height: 100vh; display: flex; flex-direction: column; }
        .container { flex: 1; max-width: 600px; margin-top: 2rem; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); }
        footer { background-color: #f8f9fa; padding: 1rem 0; text-align: center; margin-top: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card p-4">
            <h1 class="text-center mb-4">Download Your Song</h1>
            <p>Your song is ready! Click below to download:</p>
            <ul>
                {% for link in request.args.get('links') | from_json %}
                    <li><a href="{{ link }}" target="_blank">Download Song</a></li>
                {% endfor %}
            </ul>
        </div>
    </div>
    <footer>
        <p>&copy; 2025 TuneTailor. <a href="/terms">Terms</a> | <a href="/privacy">Privacy</a></p>
    </footer>
</body>
</html>
