<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Song for {{ task.name }}</title>
    <meta name="description" content="Listen to a personalized song created just for you!">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffdee9, #b5fffc);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 500px;
            width: 100%;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
        .card-title {
            font-weight: 700;
            color: #333;
        }
        .recipient-message {
            font-size: 1.1rem;
            font-style: italic;
            color: #555;
            white-space: pre-wrap;
            margin: 1.5rem 0;
        }
        .player-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            background-color: #f8f9fa;
            padding: 0.75rem 1rem;
            border-radius: 50px;
            margin-top: 1rem;
        }
        .play-btn {
            background: #6b48ff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .progress-bar-container {
            flex-grow: 1;
            height: 8px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            width: 0;
            height: 100%;
            background-color: #6b48ff;
            transition: width 0.1s linear;
        }
        .branding {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #6c757d;
        }
        .branding a {
            color: #6b48ff;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card p-4">
        <h1 class="card-title">A Special Song for {{ task.name }}!</h1>
        <p class="text-muted">For your {{ task.occasion }}</p>

        <div class="recipient-message">"{{ task.recipient_message }}"</div>

        {% for link in audio_links %}
        <div class="player-container">
            <audio class="d-none" src="{{ link }}" preload="metadata"></audio>
            <button class="play-btn">▶️</button>
            <div class="progress-bar-container">
                <div class="progress-bar-fill"></div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="branding">
        This song was created with <a href="/">Personalized Song Maker</a>
    </div>

    <script>
        document.querySelectorAll('.player-container').forEach(container => {
            const audio = container.querySelector('audio');
            const playBtn = container.querySelector('.play-btn');
            const progressBar = container.querySelector('.progress-bar-fill');

            playBtn.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play();
                } else {
                    audio.pause();
                }
            });

            audio.addEventListener('play', () => playBtn.textContent = '⏸️');
            audio.addEventListener('pause', () => playBtn.textContent = '▶️');

            audio.addEventListener('timeupdate', () => {
                const progress = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = `${progress}%`;
            });
        });
    </script>
</body>
</html>
